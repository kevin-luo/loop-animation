name: Build Preview Media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/examples/**'
      - 'src/runtime/**'
      - 'scripts/export.mjs'
      - '.github/workflows/preview-media.yml'

permissions:
  contents: write

concurrency:
  group: preview-media
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run build
      - name: Render README previews from the real Three.js demos
        run: |
          rm -rf .preview docs/media/eclipse.gif docs/media/water.gif
          node scripts/export.mjs --format gif --demo eclipse --width 960 --height 540 --fps 12 --output .preview/eclipse
          node scripts/export.mjs --format gif --demo water --width 960 --height 540 --fps 12 --output .preview/water
          mkdir -p docs/media
          cp .preview/eclipse/eclipse.gif docs/media/eclipse.gif
          cp .preview/water/water.gif docs/media/water.gif
      - name: Commit refreshed previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/eclipse.gif docs/media/water.gif
          if git diff --cached --quiet; then
            echo "Previews unchanged"
            exit 0
          fi
          git commit -m "docs: refresh generated animation previews [skip ci]"
          git push
