name: Build Preview Media

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/examples/**'
      - 'src/runtime/**'
      - 'scripts/export.mjs'
      - '.github/workflows/preview-media.yml'

permissions:
  contents: write

concurrency:
  group: preview-media
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Ensure FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
      - run: npm run build
      - name: Render README GIFs and lightweight gallery media
        run: |
          rm -rf .preview
          mkdir -p .preview docs/media

          # README animated previews. These remain intentionally short.
          node scripts/export.mjs --format gif --demo eclipse --start 8 --duration 9 --width 960 --height 540 --fps 10 --output .preview/eclipse-gif
          node scripts/export.mjs --format gif --demo water-v2 --start 7 --duration 11 --width 960 --height 540 --fps 10 --output .preview/water-v2-gif

          # Gallery posters: load instantly, no WebGL boot on the landing page.
          node scripts/export.mjs --format png --demo water-v2 --time 13 --width 960 --height 540 --output .preview/water-v2-poster
          node scripts/export.mjs --format png --demo eclipse --time 14 --width 960 --height 540 --output .preview/eclipse-poster
          node scripts/export.mjs --format png --demo dns --time 8 --width 960 --height 540 --output .preview/dns-poster
          node scripts/export.mjs --format png --demo binary --time 8 --width 960 --height 540 --output .preview/binary-poster

          # Optional motion previews for flagship cards. They are never preloaded by the Gallery;
          # the browser requests them only after the user presses “Play preview”.
          node scripts/export.mjs --format mp4 --demo water-v2 --start 7 --duration 8 --width 960 --height 540 --fps 24 --output .preview/water-v2-video
          node scripts/export.mjs --format mp4 --demo eclipse --start 8 --duration 8 --width 960 --height 540 --fps 24 --output .preview/eclipse-video

          cp .preview/eclipse-gif/eclipse.gif docs/media/eclipse.gif
          cp .preview/water-v2-gif/water-v2.gif docs/media/water-v2.gif
          cp .preview/water-v2-poster/water-v2-poster.png docs/media/water-v2-poster.png
          cp .preview/eclipse-poster/eclipse-poster.png docs/media/eclipse-poster.png
          cp .preview/dns-poster/dns-poster.png docs/media/dns-poster.png
          cp .preview/binary-poster/binary-poster.png docs/media/binary-poster.png
          cp .preview/water-v2-video/water-v2.mp4 docs/media/water-v2-preview.mp4
          cp .preview/eclipse-video/eclipse.mp4 docs/media/eclipse-preview.mp4
      - name: Commit refreshed previews
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/media/
          if git diff --cached --quiet; then
            echo "Previews unchanged"
            exit 0
          fi
          git commit -m "docs: refresh generated preview media [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
