name: Continuity QA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/examples/water/**'
      - 'src/examples/eclipse/**'
      - 'src/runtime/animation.ts'
      - 'src/runtime/canvas-viewport.ts'
      - 'src/runtime/stage-player.ts'
      - 'src/runtime/stage-player.css'
      - 'src/runtime/story.ts'
      - 'src/runtime/global.d.ts'
      - 'scripts/qa.mjs'
      - 'scripts/export-story.mjs'
      - 'package.json'
      - '.github/workflows/continuity-qa.yml'

jobs:
  flagship-continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Run strict water continuity QA
        run: npm run qa:water:strict
      - name: Run strict eclipse continuity QA
        run: npm run qa:eclipse:strict
      - name: Verify localized story exports
        run: |
          node scripts/export-story.mjs --demo water --lang zh
          node scripts/export-story.mjs --demo water --lang en
          node scripts/export-story.mjs --demo eclipse --lang zh
          node scripts/export-story.mjs --demo eclipse --lang en
      - name: Upload QA and story artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flagship-quality-artifacts
          path: |
            .output/qa/water
            .output/qa/eclipse
            .output/story/water
            .output/story/eclipse
          if-no-files-found: warn
